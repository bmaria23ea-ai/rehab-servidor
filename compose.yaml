# Servicios del sistema de sesiones: MariaDB, API y Nginx (único servicio publicado).
services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: rehab
      MARIADB_USER: rehab_api
      MARIADB_PASSWORD_FILE: /run/secrets/db_app_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - db_root_password
      - db_app_password
      - mariadb_keyfile
    volumes:
      - db_data:/var/lib/mysql                                  # datos (cifrados)
      - ./db/init:/docker-entrypoint-initdb.d:ro                # esquema y permisos, solo la primera vez
      - ./db/conf/cifrado.cnf:/etc/mysql/conf.d/cifrado.cnf:ro  # configuración de cifrado
    networks:
      - backend
    # Sin "ports": la base no se publica fuera de Docker.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: src/Rehab.Api/Dockerfile
    image: rehab-api:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_app_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    # Endurecimiento del contenedor
    read_only: true                     # sistema de archivos de solo lectura
    tmpfs:
      - /tmp                            # única carpeta escribible (temporal, en memoria)
    cap_drop:
      - ALL                             # sin privilegios especiales de Linux
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:8443"        # único puerto publicado (443 por defecto)
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./nginx/rehab.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_cert
      - tls_key
    networks:
      - frontend
      - backend
    depends_on:
      - api
    # Endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  mariadb_keyfile:
    file: ./secrets/mariadb_keyfile.txt
  tls_cert:
    file: ./secrets/tls/servidor.crt
  tls_key:
    file: ./secrets/tls/servidor.key

networks:
  frontend: {}       # red del proxy hacia afuera
  backend:
    internal: true   # red sin salida a internet (base y API)

volumes:
  db_data:
