# Versión para Azure (compose.azure.yaml). 8443 = API de los visores (certificado propio, pin),
# 8444 = portal con certificado de Let's Encrypt, 8080 = solo validación ACME y redirección a HTTPS.
server_tokens off;

limit_req_zone $binary_remote_addr zone=api_ip:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=portal_ip:1m rate=10r/s;
limit_req_status 429;

# TLS común. Unity 6.2 no soporta TLS 1.3 (llega en Unity 6.6): TLS 1.2 solo con ECDHE y cifrado autenticado.
ssl_certificate     /run/secrets/tls_cert;
ssl_certificate_key /run/secrets/tls_key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:1m;
ssl_session_timeout 1h;
ssl_session_tickets off;

client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          10s;

# DNS de Docker: re-resuelve si un contenedor se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream api_rehab {
    zone api_rehab 64k;
    server api:8080 resolve;
    keepalive 8;
}

upstream portal_rehab {
    zone portal_rehab 64k;
    server portal:8080 resolve;
    keepalive 4;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 16k;
    keepalive_timeout    30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /api/salud -> /salud
    location /api/ {
        limit_req zone=api_ip burst=10 nodelay;
        proxy_pass http://api_rehab/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    location / {
        return 404;
    }
}

server {
    listen 8444 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/le/fullchain.pem;
    ssl_certificate_key /etc/nginx/le/privkey.pem;
    client_max_body_size 64k;
    access_log off;   # las rutas del portal llevan códigos de pacientes
    keepalive_timeout    30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location / {
        limit_req zone=portal_ip burst=20 nodelay;
        proxy_pass http://portal_rehab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }
}

# HTTP: solo el desafío de Let's Encrypt; todo lo demás va a HTTPS
server {
    listen 8080;
    server_name _;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Salud interna (solo 127.0.0.1 del contenedor): Nginx -> API -> MariaDB.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /salud {
        proxy_pass http://api_rehab/salud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}
