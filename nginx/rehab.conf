# Proxy inverso: único punto publicado. Solo HTTPS con TLS 1.3 y solo la ruta /api/.
server_tokens off;                                         # no revela la versión de Nginx

# Limitación de tasa por IP (5 peticiones/s, ráfagas de 10)
limit_req_zone $binary_remote_addr zone=api_ip:1m rate=5r/s;
limit_req_status 429;

upstream api_rehab {
    server api:8080;
    keepalive 8;
}

server {
    listen 8443 ssl;                                       # el contenedor publica 443 -> 8443
    http2 on;
    server_name _;

    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    # TLS 1.2 y 1.3. Unity 6.2 (UnityWebRequest) aún no soporta TLS 1.3 (llega en Unity 6.6).
    # En TLS 1.2 solo se permiten suites con secreto perfecto hacia adelante y cifrado autenticado.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Peticiones pequeñas y tiempos cortos
    client_max_body_size  16k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /api/... se reenvía a la API sin el prefijo (/api/salud -> /salud)
    location /api/ {
        limit_req zone=api_ip burst=10 nodelay;
        proxy_pass http://api_rehab/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # Cualquier otra ruta no existe
    location / {
        return 404;
    }
}

# Chequeo de salud interno: solo escucha dentro del contenedor (127.0.0.1), no se publica.
# Recorre toda la cadena: Nginx -> API -> MariaDB.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /salud {
        proxy_pass http://api_rehab/salud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}
