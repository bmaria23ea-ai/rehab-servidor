# Ajustes para el servidor de Azure (ARM64, 1 GiB). Se aplica sobre compose.yaml
# (COMPOSE_FILE=compose.yaml:compose.azure.yaml en el .env del servidor).
services:
  db:
    mem_limit: 384m
    volumes:
      - ./db/conf/memoria.cnf:/etc/mysql/conf.d/memoria.cnf:ro

  api:
    image: rehab-api:arm64
    pull_policy: never
    environment:
      DOTNET_gcServer: "0"   # GC de estación de trabajo: menos memoria

  portal:
    image: rehab-portal:arm64
    pull_policy: never
    environment:
      DOTNET_gcServer: "0"

  proxy:
    ports:
      - "80:8080"            # solo desafío de Let's Encrypt y redirección a HTTPS
    volumes:
      - ./nginx/rehab.azure.conf:/etc/nginx/conf.d/default.conf:ro
      - le_certs:/etc/nginx/le:ro
      - acme_webroot:/var/www/certbot:ro

  # Se ejecuta a pedido: docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot:v5.9.0
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      - le_certs:/salida
      - ./scripts/certbot-deploy.sh:/hooks/deploy.sh:ro
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  letsencrypt: {}
  acme_webroot: {}
  le_certs: {}
